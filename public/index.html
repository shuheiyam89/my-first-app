<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My ToDo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My ToDo</h1>
    <form id="todo-form">
      <input id="todo-input" type="text" placeholder="やることを入力..." autocomplete="off" required>
      <button type="submit">追加</button>
    </form>
    <ul id="todo-list"></ul>
    <p id="todo-count" class="count"></p>
  </main>
  <script src="app.js"></script>
</body>
</html>
